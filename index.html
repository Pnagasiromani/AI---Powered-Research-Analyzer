<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Selection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pyscript.net/alpha/pyscript.css" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
</head>
<body>

    <div class="container">
        <h2>AI POWERED RESEARCH ANALYZER</h2>

        <label for="groq-api">Enter your Groq API Key:</label>
        <input type="password" id="groq-api" placeholder="Enter your Groq API Key">
        
        <label for="openrouter-api">Enter your OpenRouter API Key:</label>
        <input type="password" id="openrouter-api" placeholder="Enter your OpenRouter API Key">
        
        <label for="groq-model">Select Groq Model:</label>
        <select id="groq-model">
            <option value="deepseek-r1-distill-llama-70b">deepseek-r1-distill-llama-70b</option>
            <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
            <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
            <option value="mixtral-8x7b-32768">mixtral-8x7b-32768</option>
        </select>

        <label for="openrouter-model">Select OpenRouter Model:</label>
        <select id="openrouter-model">
            <option value="gemini-2.0-flash-lite-preview">google/gemini-2.0-flash-lite-preview-02-05:free</option>
            <option value="gemini-2.0-pro-exp">google/gemini-2.0-pro-exp-02-05:free</option>
            <option value="qwen-vl-plus">qwen/qwen-vl-plus:free</option>
        </select>

        <label for="query">Enter your research query:</label>
        <input type="text" id="query" placeholder="Enter your query here">

        <label for="max-pages">Max pages to crawl:</label>
        <input type="number" id="max-pages" value="3" min="1">

        <button id="start-analysis">Start Analysis</button>
        <div id="results"></div>
    </div>
    <py-script src="pyscript_code.py"></py-script>
        <py-script src="script.js"></py-script>

</body>
</html>
